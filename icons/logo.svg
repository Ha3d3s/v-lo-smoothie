    <circle cx="256" cy="300" r="10" fill="#FFF4E0" stroke="none"/>
    <line x1="256" y1="300" x2="256" y2="160"/>
    <line x1="256" y1="300" x2="371" y2="235"/>
    <line x1="256" y1="300" x2="371" y2="365"/>
    <line x1="256" y1="300" x2="256" y2="440"/>
    <line x1="256" y1="300" x2="141" y2="365"/>
    <line x1="256" y1="300" x2="141" y2="235"/>
  </g>

  <!-- glass -->
