<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B8F"/>
      <stop offset="55%" stop-color="#FF3D6E"/>
      <stop offset="100%" stop-color="#FFB020"/>
