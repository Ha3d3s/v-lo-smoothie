      <circle cx="285" cy="290" r="5" fill="#FFF4E0" opacity=".85"/>
      <circle cx="250" cy="330" r="6" fill="#FFF4E0" opacity=".85"/>
    </g>
    <path d="M197 118 H315 L300 336 Q298 358 276 358 H236 Q214 358 212 336 Z"
